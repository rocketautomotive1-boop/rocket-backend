version: '3.8'

services:
  # MongoDB - Catalog Store
  mongodb:
    image: mongo:6.0
    container_name: rocket_mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=rocketpassword
    volumes:
      - mongo_data:/data/db
    networks:
      - rocket_network

  # ElasticSearch - Search Engine
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: rocket_elastic
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # Disabled for local dev simplicity
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - rocket_network

  # Kibana - Search Dashboard (Optional)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: rocket_kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - rocket_network

volumes:
  mongo_data:
  es_data:


networks:
  rocket_network:
    driver: bridge
